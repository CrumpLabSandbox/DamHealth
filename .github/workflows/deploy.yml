name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch current NID export
        run: bash data/pipeline/fetch_raw.sh

      - name: Run data pipeline
        run: |
          python3 -I data/pipeline/build_dataset.py
          python3 -I data/pipeline/score_and_plan.py
          python3 -I data/pipeline/publish.py

      - name: Keep the exact NID input and recheck report
        uses: actions/upload-artifact@v7
        with:
          name: nid-input-${{ github.sha }}
          path: |
            data/raw/nation.csv
            data/build/merge_report.json
            data/build/score_report.json
            data/build/recheck_report.json
          retention-days: 90
          if-no-files-found: warn

      - name: Pipeline tests
        run: |
          pip install -q pytest
          python3 -m pytest -q data/tests

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build site
        working-directory: site
        run: |
          npm ci
          npm run test
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
